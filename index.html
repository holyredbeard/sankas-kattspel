<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6c6e6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%98%BB%3C/text%3E%3C/svg%3E">
<title>Sankas Kattkärlek</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#f3d1ee;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
    font-family:"Baloo 2","Nunito","Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:center;align-items:flex-start;
    padding:calc(env(safe-area-inset-top) + 10px) 76px 0;pointer-events:none;z-index:5}
  #score{background:rgba(255,255,255,.82);color:#c2187a;font-weight:800;border-radius:999px;
    padding:8px 22px;font-size:clamp(22px,5.2vmin,44px);box-shadow:0 4px 14px rgba(180,60,150,.25);
    white-space:nowrap;display:none}
  #score b{display:inline-block;min-width:1.2em;text-align:center;color:#ff2d8a}
  #score.pop b{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
  @keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.6) rotate(-6deg)}100%{transform:scale(1)}}
  #mute{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);right:calc(env(safe-area-inset-right) + 10px);z-index:20;
    width:58px;height:58px;border-radius:50%;border:none;background:rgba(255,255,255,.85);font-size:28px;
    box-shadow:0 4px 12px rgba(150,60,150,.25);cursor:pointer;touch-action:manipulation}
  #home{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 10px);z-index:20;
    width:58px;height:58px;border-radius:50%;border:none;background:rgba(255,255,255,.85);font-size:26px;
    box-shadow:0 4px 12px rgba(150,60,150,.25);cursor:pointer;display:none}
  #start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 4vh) 16px calc(env(safe-area-inset-bottom) + 5vh);box-sizing:border-box;pointer-events:none}
  #start h1{margin:0;text-align:center;color:#fff;font-size:clamp(38px,10vmin,96px);line-height:1.02;font-weight:900;
    text-shadow:0 3px 0 #e0559f,0 6px 0 #b63c86,0 10px 22px rgba(120,30,110,.35);letter-spacing:1px;
    animation:bob 2.6s ease-in-out infinite}
  #start h1 small{display:block;font-size:.42em;color:#fff6fb;text-shadow:0 2px 0 #c26ab8,0 4px 12px rgba(120,30,110,.3);margin-top:.35em}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
  .bottom{display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:auto}
  #play{pointer-events:auto;font:inherit;font-weight:900;font-size:clamp(40px,10vmin,84px);color:#fff;border:none;cursor:pointer;
    padding:.25em 1.4em;border-radius:999px;background:linear-gradient(180deg,#ff8cc6,#ff4fa3);
    box-shadow:0 8px 0 #c42d7c,0 14px 30px rgba(196,45,124,.45);animation:pulse 1.3s ease-in-out infinite;touch-action:manipulation}
  #play:active{transform:translateY(5px);box-shadow:0 3px 0 #c42d7c}
  @keyframes pulse{0%,100%{scale:1}50%{scale:1.07}}
  .hint{color:#7a2a78;background:rgba(255,255,255,.75);border-radius:18px;padding:6px 16px;font-size:clamp(16px,3.6vmin,26px);font-weight:700;text-align:center}
  #custom{font:inherit;font-size:15px;border:none;background:rgba(255,255,255,.55);color:#7a2a78;border-radius:999px;padding:6px 14px;cursor:pointer}
  #panel{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(90,30,90,.35)}
  #panel .box{background:#fff;border-radius:24px;padding:20px;max-width:360px;width:88%;color:#6a2368;font-size:17px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  #panel h2{margin:0 0 10px;font-size:22px}
  #panel label{display:block;margin:10px 0 4px;font-weight:700}
  #panel input{width:100%;font-size:15px}
  #panel button{font:inherit;margin-top:14px;margin-right:8px;padding:8px 16px;border-radius:999px;border:none;background:#ff6fb5;color:#fff;font-weight:800;cursor:pointer}
  #panel button.sec{background:#e9d7f3;color:#6a2368}
  #popup{position:fixed;left:50%;top:24%;z-index:8;transform:translate(-50%,-50%);pointer-events:none;
    font-size:clamp(30px,min(11vmin,8.6vw),110px);font-weight:900;color:#fff;white-space:nowrap;opacity:0;
    text-shadow:0 3px 0 #ff4fa3,0 6px 0 #a43aa8,0 10px 30px rgba(120,30,110,.45)}
  #popup.show{animation:popup 2.1s ease-out forwards}
  @keyframes popup{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-12deg)}
    15%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}
    25%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}
    80%{opacity:1;transform:translate(-50%,-50%) scale(1.04) rotate(0)}
    100%{opacity:0;transform:translate(-50%,-62%) scale(.9)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="score">Kärlekspoäng: <b id="num">0</b></div></div>
<button id="mute" aria-label="Ljud av/på">🔊</button>
<button id="home" aria-label="Till start">🏠</button>
<div id="popup"></div>
<div id="start">
  <h1>Sankas<br>Kattkärlek<small>💖 Ge katterna kärlek! 💖</small></h1>
  <div class="bottom">
    <div class="hint">Peka på katterna så skickar Sanka kärleksstrålar! 😻</div>
    <button id="play">Spela!</button>
    <button id="custom">🖼️ Egna bilder</button>
  </div>
</div>
<div id="panel"><div class="box">
  <h2>Egna bilder</h2>
  <div>Välj bilder från telefonen (helst med vit eller genomskinlig bakgrund).</div>
  <label>Ansikte</label><input type="file" accept="image/*" id="fFace">
  <label>Katt 1</label><input type="file" accept="image/*" id="fCat1">
  <label>Katt 2</label><input type="file" accept="image/*" id="fCat2">
  <button id="pOk">Klar</button><button class="sec" id="pReset">Återställ</button>
</div></div>

    for(let y=Math.round(by-r*1.2);y<=by+r*1.2;y++)for(let x=Math.round(bx-r*1.2);x<=bx+r*1.2;x++){
      if(x<0||y<0||x>=w||y>=h)continue;if((x-bx)**2+(y-by)**2>(r*1.2)**2)continue;if(L[y*w+x]<thr){sx+=x;sy+=y;n++;}}

      const dx=(x-e.x)/(2.25*r),dy=(y-e.y)/(1.3*r);if(dx*dx+dy*dy>1)continue;
      const k=(y*w+x)*4,R=p[k],G=p[k+1],B=p[k+2],lum=L[y*w+x],dd=Math.hypot(x-e.x,y-e.y);

      if(lum<95&&dd>r*1.08)a=0;                          // lashes / lid line outside the iris
      if(R-G>22&&lum>120)a=0;                            // pink caruncle / lid rim

    // keep only the region connected to the iris centre
    const keep=new Uint8Array(mw*mh),q=[];const ci=Math.round(e.x)-x0,cj=Math.round(e.y)-y0;
    const s0=cj*mw+ci;keep[s0]=1;q.push(s0);
    while(q.length){const k=q.pop(),i=k%mw,j=(k/mw)|0;
      for(const n of [i>0?k-1:-1,i<mw-1?k+1:-1,j>0?k-mw:-1,j<mh-1?k+mw:-1]){if(n>=0&&!keep[n]&&A[n]>0.35){keep[n]=1;q.push(n);}}}
    const mask=mkCanvas(mw,mh),mg=mask.getContext('2d'),md=mg.createImageData(mw,mh);

    if(ok){eye.mxL=Math.max(0.25*r,(ci-minX)-r*0.95);eye.mxR=Math.max(0.25*r,(maxX-ci)-r*0.95);eye.my=0.28*r;}
    else{almondMask(eye,1.85*r,0.82*r);}

}

function almondMask(e,ew,eh){
  const bw=Math.ceil(ew+2),bh=Math.ceil(eh*1.2+2);e.x0=Math.round(e.x-bw);e.y0=Math.round(e.y-bh);
  e.mask=mkCanvas(bw*2+1,bh*2+1);e.layer=mkCanvas(bw*2+1,bh*2+1);const g=e.mask.getContext('2d');
  const x=e.x-e.x0,y=e.y-e.y0;g.fillStyle='#000';g.beginPath();g.moveTo(x-ew,y+eh*0.12);g.quadraticCurveTo(x-ew*0.1,y-eh*2.05,x+ew,y+eh*0.02);
  g.quadraticCurveTo(x+ew*0.05,y+eh*1.75,x-ew,y+eh*0.12);g.closePath();g.fill();
  e.mxL=e.mxR=Math.max(0.25*e.r,ew-e.r*1.0);e.my=eh*0.32;
}

function heartPath(g,x,y,s){g.beginPath();g.moveTo(x,y+s*0.3);
  g.bezierCurveTo(x,y,x-s*0.5,y-s*0.05,x-s*0.5,y+s*0.3);g.bezierCurveTo(x-s*0.5,y+s*0.6,x-s*0.1,y+s*0.75,x,y+s);
  g.bezierCurveTo(x+s*0.1,y+s*0.75,x+s*0.5,y+s*0.6,x+s*0.5,y+s*0.3);g.bezierCurveTo(x+s*0.5,y-s*0.05,x,y,x,y+s*0.3);g.closePath();}

// ---------------- audio ----------------
let actx=null,master=null,muted=false;
try{muted=localStorage.getItem('sanka_muted')==='1';}catch(e){}
function initAudio(){
  if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    actx=new AC();master=actx.createGain();master.gain.value=muted?0:0.9;master.connect(actx.destination);
    const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);}
  if(actx.state==='suspended')actx.resume();
}
function meow(pitch){
  if(!actx||muted)return;const t=actx.currentTime+0.01,d=rnd(0.5,0.75);
  const f0=560*pitch;
  const o1=actx.createOscillator(),o2=actx.createOscillator();o1.type='sawtooth';o2.type='triangle';o2.detune.value=9;
  for(const o of [o1,o2]){const f=o.frequency;f.setValueAtTime(f0*0.8,t);f.exponentialRampToValueAtTime(f0*1.28,t+d*0.25);
    f.exponentialRampToValueAtTime(f0*1.12,t+d*0.55);f.exponentialRampToValueAtTime(f0*0.68,t+d);}
  const lfo=actx.createOscillator(),lg=actx.createGain();lfo.frequency.value=6.5;lg.gain.value=f0*0.025;lfo.connect(lg);lg.connect(o1.frequency);lg.connect(o2.frequency);
  const mix=actx.createGain();mix.gain.value=0.5;o1.connect(mix);o2.connect(mix);
  const f1=actx.createBiquadFilter();f1.type='bandpass';f1.Q.value=5;
  f1.frequency.setValueAtTime(600,t);f1.frequency.linearRampToValueAtTime(1250,t+d*0.35);f1.frequency.linearRampToValueAtTime(700,t+d);
  const f2=actx.createBiquadFilter();f2.type='bandpass';f2.Q.value=7;
  f2.frequency.setValueAtTime(1700,t);f2.frequency.linearRampToValueAtTime(2600,t+d*0.3);f2.frequency.linearRampToValueAtTime(1300,t+d);
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
  const g1=actx.createGain(),g2=actx.createGain(),g3=actx.createGain();g1.gain.value=1.4;g2.gain.value=0.8;g3.gain.value=0.25;
  mix.connect(f1);f1.connect(g1);mix.connect(f2);f2.connect(g2);mix.connect(lp);lp.connect(g3);
  const env=actx.createGain();env.gain.setValueAtTime(0.0001,t);env.gain.exponentialRampToValueAtTime(0.5,t+0.06);
  env.gain.linearRampToValueAtTime(0.42,t+d*0.6);env.gain.exponentialRampToValueAtTime(0.0001,t+d);
  g1.connect(env);g2.connect(env);g3.connect(env);env.connect(master);
  for(const o of [o1,o2,lfo]){o.start(t);o.stop(t+d+0.05);}
}
function pew(){
  if(!actx||muted)return;const t=actx.currentTime+0.005;
  const o=actx.createOscillator(),g=actx.createGain();o.type='sine';
  o.frequency.setValueAtTime(1500,t);o.frequency.exponentialRampToValueAtTime(380,t+0.18);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.14,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+0.22);
  const o2=actx.createOscillator(),g2=actx.createGain();o2.type='triangle';
  o2.frequency.setValueAtTime(2400,t);o2.frequency.exponentialRampToValueAtTime(900,t+0.12);
  g2.gain.setValueAtTime(0.05,t);g2.gain.exponentialRampToValueAtTime(0.0001,t+0.13);o2.connect(g2);g2.connect(master);o2.start(t);o2.stop(t+0.15);
}
function chime(notes,step){
  if(!actx||muted)return;const t0=actx.currentTime+0.01;
  notes.forEach((f,i)=>{const t=t0+i*step,o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+0.55);});
}
// giant-panda style bleat: short, high, nasal squeaks ("eek-eek"), clearly not a meow
function pandaBleat(){
  if(!actx||muted)return;const t0=actx.currentTime+0.01,n=Math.random()<0.5?2:3,base=rnd(1050,1350);
  for(let i=0;i<n;i++){const t=t0+i*rnd(0.11,0.14),d=rnd(0.07,0.1),f0=base*(1+i*0.06);
    const o=actx.createOscillator(),o2=actx.createOscillator();o.type='square';o2.type='sine';
    for(const os of [o,o2]){os.frequency.setValueAtTime(f0*0.85,t);os.frequency.exponentialRampToValueAtTime(f0*1.25,t+d*0.35);os.frequency.exponentialRampToValueAtTime(f0*0.95,t+d);}
    o2.detune.value=1200;
    const bp=actx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2300;bp.Q.value=2.2;
    const pk=actx.createBiquadFilter();pk.type='peaking';pk.frequency.value=3400;pk.gain.value=8;pk.Q.value=3;
    const g=actx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.11,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    const g2=actx.createGain();g2.gain.value=0.25;
    o.connect(bp);bp.connect(pk);pk.connect(g);o2.connect(g2);g2.connect(g);g.connect(master);
    o.start(t);o2.start(t);o.stop(t+d+0.02);o2.stop(t+d+0.02);}
}
// happy chirp series when the panda is caught
function pandaHappy(){
  if(!actx||muted)return;const t0=actx.currentTime+0.02;
  [1300,1500,1750,2050,2400].forEach((f,i)=>{const t=t0+i*0.075,d=0.07;
    const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';
    o.frequency.setValueAtTime(f*0.8,t);o.frequency.exponentialRampToValueAtTime(f*1.3,t+d);
    const lfo=actx.createOscillator(),lg=actx.createGain();lfo.frequency.value=38;lg.gain.value=f*0.06;lfo.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);lfo.start(t);o.stop(t+d+0.02);lfo.stop(t+d+0.02);});
  setTimeout(pandaBleat,480);
}

let last=performance.now(),dtG=0;
function frame(now){
  let dt=Math.min(0.05,(now-last)/1000);last=now;dtG=dt;time+=dt;
  // spawning
  spawnT-=dt;
  if(state==='play'&&!window.__hold){const active=cats.filter(c=>c.st==='fall'&&!c.panda).length;const maxC=Math.min(7,3+Math.floor(score/12));
    if(spawnT<=0&&active<maxC){spawnCat(false);spawnT=Math.max(0.7,1.8-score*0.018)*rnd(0.75,1.25);}
    pandaT-=dt;if(pandaT<=0){spawnPanda();pandaT=rnd(15,25);} }
  else if(state==='menu'){if(spawnT<=0&&cats.length<3){spawnCat(true);spawnT=rnd(1.5,2.5);}}
  for(let i=cats.length-1;i>=0;i--){const c=cats[i];c.t+=dt;
    if(c.st==='fall'&&c.panda){c.x+=c.vx*dt;c.ph+=dt*8.5;
      const ground=Math.abs(Math.sin(c.ph))<0.18;
      if(ground&&!c.lastGround){for(let k=0;k<3;k++)parts.push({x:c.x-c.dir*c.size*0.25+rnd(-8,8),y:c.y+c.size*0.42,vx:-c.dir*rnd(15,50),vy:rnd(-30,-8),life:0.55,max:0.55,size:rnd(7,13),type:'dust',col:'#fff',rot:0});}
      c.lastGround=ground;c.bleatT-=dt;if(c.bleatT<=0){pandaBleat();c.bleatT=rnd(0.9,1.4);}
      if((c.dir>0&&c.x>W+c.size)||(c.dir<0&&c.x<-c.size))cats.splice(i,1);}
    else if(c.st==='fall'){c.y+=c.vy*dt;if(c.y>H*0.82)c.alpha=clamp(1-(c.y-H*0.82)/(H*0.18+c.size*0.6),0,1);if(c.y>H+c.size)cats.splice(i,1);}
    else{c.t2+=dt;if(!c.hit&&c.t2>=0.12)catHit(c);if(c.t2>1.15)cats.splice(i,1);}}
  for(let i=beams.length-1;i>=0;i--){beams[i].t+=dt;if(beams[i].t>beams[i].dur)beams.splice(i,1);}
  // eye target
  let tgt=null;
  if(tapLookT>0){tapLookT-=dt;tgt=tapLook;}
  const lovedNow=cats.find(c=>c.st==='loved'&&c.t2<0.5);
  if(lovedNow)tgt={x:lovedNow.lx,y:lovedNow.ly};
  if(!tgt){let bd=1e9;const fc={x:W/2,y:H/2};
    for(const c of cats){if(c.st!=='fall'||c.y<-c.size*0.3)continue;const p=catPos(c);const d=Math.hypot(p.x-fc.x,p.y-fc.y)-(c.panda?900:c.golden?400:0);if(d<bd){bd=d;tgt=p;}}}
  if(!tgt)tgt={x:W/2+Math.sin(time*0.7)*W*0.2,y:H*0.45};
  const kk=1-Math.exp(-dt*10);look.x=lerp(look.x,tgt.x,kk);look.y=lerp(look.y,tgt.y,kk);
  // draw
  drawBg();
  if(face)drawFace();
  for(const c of cats)if(c.st==='fall')drawCat(c);
  for(const b of beams)drawBeam(b);
  for(const c of cats)if(c.st==='loved')drawCat(c);
  drawParts(dt);drawTexts(dt);
  requestAnimationFrame(frame);
}

window.__game={get cats(){return cats.filter(c=>!c.panda).map(c=>({x:catPos(c).x,y:catPos(c).y,size:c.size,st:c.st,golden:c.golden}));},get score(){return score;},
  get eyes(){return face.eyes.map(e=>({x:e.x,y:e.y,r:e.r,sx:e.sx,sy:e.sy,iris:e.iris,sclera:e.sclera}));},faceBox:()=>faceBox,
  placeCat(x,y,sz){spawnCat(false);const c=cats[cats.length-1];c.x=x;c.y=y;c.wa=0;c.vy=0;if(sz)c.size=sz;c.golden=false;return c;},freeze(){cats.forEach(c=>c.vy=0);},clear(){cats=[];},
  forcePanda(dir){const c=spawnPanda();if(c&&dir&&dir!==c.dir){c.dir=dir;c.flip=-dir;c.vx=-c.vx;c.x=dir>0?-c.size*0.7:W+c.size*0.7;}return !!c;},
  get panda(){const c=cats.find(c=>c.panda);if(!c)return null;const p=catPos(c);return {x:p.x,y:p.y,size:c.size,st:c.st,dir:c.dir};},
  forceGolden(){spawnCat(false);const c=cats[cats.length-1];c.golden=true;c.y=H*0.3;},setScore(v){score=v;lastMilestone=0;for(const m of MILESTONES)if(m<v)lastMilestone=m;}};

setMuted(muted);
buildAssets().then(()=>{resize();look={x:W/2,y:H/2};requestAnimationFrame(t=>{last=t;frame(t);});window.__ready=true;});
})();
</script>
